<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drop Time</title>
  <meta name="description" content="Eye drop reminders and records after cataract surgery.">
  <meta name="theme-color" content="#EEF3F2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Drop Time">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" aria-live="polite"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="overlay-root"></div>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <noscript><p style="padding:24px;font:18px system-ui">Drop Time needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
